<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena模型探测工具 · 使用说明</title><style>body{margin:0;background:#f7f9fc;color:#294667;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;line-height:1.9}main{max-width:900px;padding:22px 40px}h1{font-size:28px;margin:0 0 22px;color:#334155}ol{padding-left:40px;margin:0}li{padding-left:0;margin:0 0 16px}p{margin:18px 0 0;color:#52677f;font-size:14px}</style></head><body><main><h1>Arena模型探测工具</h1><ol><li>点击“打开 Arena”。</li><li>如果当前桌面版本提供“注册/登录”，可点击使用其注册或登录流程；否则在 Arena 网页完成登录。出现人机验证或首次使用条款时，请先在网页处理。</li><li>如果当前桌面版本提供“开始抽卡”，可点击并等待结果；否则打开或选择对话，使用“发送鹈鹕骑车测试”。</li><li>如有卡片结果，可选择后进行二次验证；同时查看模型标签、推理配置及 Token 信息。</li></ol><p>具体按钮取决于当前桌面程序版本，合并 assets 不会升级 EXE。请保留已有草稿，不要夹带附件；正在生成、需要验证或被限流时先等待或处理网页。</p></main></body></html>
